name: Apply conversation navigation performance patch

on:
  push:
    branches: [perf/web-conversation-switching]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage conversation navigation performance patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated navigation patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded))
          expected = 'fe5a534329754c961a6437239f8e22d70a03940414dc45dc8280e09a93af796c'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch hash mismatch: {actual}')
          open('/tmp/nav-perf.patch', 'wb').write(patch)
          PY
          git apply --check /tmp/nav-perf.patch
          git apply /tmp/nav-perf.patch
          git rm .github/workflows/apply-nav-perf.yml
          git diff --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'perf(web): warm conversation navigation'
          git push origin HEAD:perf/web-conversation-switching
