name: Temporary Fix v0.1.28 Prebuild

on:
  push:
    branches:
      - tmp/release-host-health-v0128
    paths:
      - .github/workflows/tmp-fix-release-prebuild.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact prebuild script on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-react/package.json')
          s=p.read_text()
          bad='"prebuild:renderer": "npm run prepare-chat-stickers"'
          good='"prebuild:renderer": "npm run prepare:stickers"'
          if bad not in s:
              raise SystemExit('expected bad prebuild string not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-react/package.json
          git commit -m 'fix(release): restore renderer prebuild script'
          git push origin HEAD:main
