name: Windows x86 Release

# Every x64 stable release gets a matching 32-bit installer, published as a
# separate prerelease (win32-vX.Y.Z-rN) so /releases/latest, latest.yml and
# the x64 updater never see it. A manual run re-issues the current main with
# the next revision when an x86-only fix lands between x64 releases.
on:
  workflow_run:
    workflows: ["Windows Release", "Windows Release On Version Commit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-x86-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose the source and the next free tag
        id: plan
        run: |
          set -euo pipefail
          # Electron 43, the last line with Windows ia32, loses security support in January 2027.
          if [ "$(date -u +%Y%m%d)" -ge 20270201 ]; then
            echo "::warning::32-bit releases ended with Electron 43's security support; see win32-local/README.md."
            exit 0
          fi
          git fetch --tags --force origin
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Build exactly what the x64 release shipped: its tag, not main.
            tag=$(gh release view --json tagName --jq .tagName)
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Latest release $tag is not an x64 stable tag"; exit 1; }
            version=${tag#v}
            ref=$tag
            if git tag --list "win32-v$version-r*" | grep -q .; then
              echo "x86 build for $version already exists; nothing to do."
              exit 0
            fi
          else
            [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ] || { echo "Run on the default branch."; exit 1; }
            version=$(jq -r .version desktop-react/package.json)
            ref=$GITHUB_SHA
          fi
          revision=1
          while git tag --list "win32-v$version-r$revision" | grep -q .; do revision=$((revision + 1)); done
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$ref^{commit}")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=win32-v$version-r$revision" >> "$GITHUB_OUTPUT"
          echo "x86 release win32-v$version-r$revision from $ref"

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    uses: ./.github/workflows/windows-x86-local.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
    secrets: inherit

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Loom-Windows-x86
          path: publish
      - name: Publish the separate x86 prerelease
        run: |
          set -euo pipefail
          installer=publish/Loom-Setup-x86.exe
          [ "$(stat -c %s "$installer")" -gt 1000000 ] || { echo "Installer is incomplete"; exit 1; }
          digest=$(sha256sum "$installer" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          Loom for Windows **32-bit** ($VERSION), native local Host.

          - Same Loom desktop, Agent and local Host as x64, built for ia32 (Electron 43).
          - Gated on CI: frozen x86 Agent, App Server, local Host, desktop attach, terminal, Edge launch, and an x86 audit of every bundled binary. CI runs on 64-bit Windows; no physical 32-bit QA.
          - Not available on 32-bit: the Windows OS sandbox (commands that require it are refused) and a full ConPTY terminal (line-oriented pipe terminal instead). Browser tasks use the installed Edge or Chrome.
          - No auto-update: install the next 32-bit build from Releases.
          - Electron 43 is the last line with Windows ia32; its security support ends in January 2027, and 32-bit builds stop then.

          Installer SHA256: \`$digest\`
          NOTES
          gh release create "$TAG" "$installer" --repo "${{ github.repository }}" --prerelease --target "$SHA" \
            --title "Loom $VERSION for Windows 32-bit" --notes-file notes.md
          assets=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isPrerelease,assets --jq '[.isPrerelease, (.assets | map(.name) | join(","))] | @tsv')
          [ "$assets" = "$(printf 'true\tLoom-Setup-x86.exe')" ] || { echo "Unexpected release shape: $assets"; exit 1; }
          echo "Published https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
