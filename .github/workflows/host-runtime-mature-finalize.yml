name: Finalize mature Loom Host runtime

on:
  push:
    branches:
      - automation/host-runtime-mature
    paths:
      - .github/host-runtime-mature.patch
      - .github/workflows/host-runtime-mature-finalize.yml

permissions:
  contents: write

concurrency:
  group: host-runtime-mature-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/host-runtime-mature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Host runtime patch
        run: |
          git apply --check .github/host-runtime-mature.patch
          git apply .github/host-runtime-mature.patch

      - name: Run Host contracts
        run: |
          python -m pip install --quiet -e '.[dev,browser]'
          python -m pytest -q \
            tests/test_loom_host_background_runtime.py \
            tests/test_loom_web_local_host_contract.py \
            tests/test_loom_web_local_first_contract.py \
            tests/test_web_host_launch_onboarding.py

      - name: Build Desktop and Web
        working-directory: desktop-react
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Publish clean Host runtime commit
        run: |
          rm -f .github/host-runtime-mature.patch
          rm -f .github/workflows/host-runtime-mature-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Loom Host a first-class background runtime"
          git push origin HEAD:automation/host-runtime-mature
