name: Temporary Host Health v0.1.28 Release Bump

on:
  push:
    branches:
      - tmp/release-host-health-v0128
    paths:
      - .github/workflows/tmp-release-host-health-v0128.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create guarded release commit on main
        shell: bash
        run: |
          set -euo pipefail
          expected='f65f6108886ccc2b32792cc8b3fa9140a30d8e3f'
          git fetch origin main --tags
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$expected" || { echo "main moved: $actual" >&2; exit 21; }
          git checkout --detach "$actual"
          current="$(node -p "require('./desktop-react/package.json').version")"
          test "$current" = '0.1.27' || { echo "unexpected version: $current" >&2; exit 22; }
          pushd desktop-react >/dev/null
          npm version patch --no-git-tag-version
          popd >/dev/null
          next="$(node -p "require('./desktop-react/package.json').version")"
          test "$next" = '0.1.28'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-react/package.json desktop-react/package-lock.json
          git commit -m 'chore(release): Loom v0.1.28'
          git push origin HEAD:main
