name: Windows x86 Local Host

# Builds and gates the native 32-bit installer on every change that reaches
# it, so main never silently stops building for x86. The release workflow
# calls this same job; there is one x86 recipe.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "loom_*.py"
      - "pyproject.toml"
      - "desktop-react/**"
      - "extensions/browser-current-tab/**"
      - "win32-local/**"
      - ".github/actions/windows-build-setup/**"
      - ".github/workflows/windows-x86-local.yml"
  pull_request:
    paths:
      - "app/**"
      - "loom_*.py"
      - "pyproject.toml"
      - "desktop-react/**"
      - "extensions/browser-current-tab/**"
      - "win32-local/**"
      - ".github/actions/windows-build-setup/**"
      - ".github/workflows/windows-x86-local.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to build"
        required: true
        type: string

permissions:
  contents: read

# Only the newest commit needs a Windows runner; a release build (called with
# an explicit ref) gets its own group so a push never cancels it.
concurrency:
  group: loom-x86-local-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
  package-windows-ia32-local:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LOOM_GITHUB_CLIENT_ID: ${{ vars.LOOM_GITHUB_CLIENT_ID }}
      LOOM_GITHUB_CLIENT_SECRET: ${{ secrets.LOOM_GITHUB_CLIENT_SECRET }}
      LOOM_GITHUB_OAUTH_SCOPES: ${{ vars.LOOM_GITHUB_OAUTH_SCOPES || 'repo read:org' }}
      LOOM_GITHUB_CALLBACK_PATH: ${{ vars.LOOM_GITHUB_CALLBACK_PATH || '/oauth/github/callback' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/windows-build-setup
        with:
          python-architecture: x86
      - name: Install desktop JS dependencies
        working-directory: desktop-react
        run: npm ci --no-audit --no-fund
      - name: Verify Loom deep-link installer parity
        working-directory: desktop-react
        run: node --test scripts/tests/windows-x86-installer-protocol.test.mjs
      - name: Compile Loom desktop and renderer
        working-directory: desktop-react
        run: npm run build
      - name: Freeze the 32-bit Python Agent
        working-directory: desktop-react
        run: npm run build:runtime:win:x86
      - name: Package the IA32 desktop
        working-directory: desktop-react
        run: npx electron-builder --win --ia32 --dir --config build/win32-local.config.cjs --publish never
      - name: Exercise frozen Python, local Host and desktop attach
        shell: pwsh
        run: |
          $dir = "desktop-react/release-x86/win-ia32-unpacked"
          if (-not (Test-Path $dir)) { throw "IA32 Electron unpacked directory is missing" }
          & "win32-local/verify-local-host.ps1" -InstallDir (Resolve-Path $dir)
          if ($LASTEXITCODE -ne 0) { throw "IA32 Host verification failed" }
      - name: Build the IA32 installer
        working-directory: desktop-react
        shell: pwsh
        run: |
          npx electron-builder --win nsis --ia32 --prepackaged release-x86/win-ia32-unpacked --config build/win32-local.config.cjs --publish never
          if ($LASTEXITCODE -ne 0) { throw "IA32 installer failed" }
          $installer = @(Get-ChildItem release-x86 -Filter "Loom-Setup-x86-*.exe" -File)
          if ($installer.Count -ne 1 -or $installer[0].Length -lt 1000000) { throw "Expected one complete x86 installer" }
          Copy-Item $installer[0].FullName release-x86/Loom-Setup-x86.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Loom-Windows-x86
          path: desktop-react/release-x86/Loom-Setup-x86.exe
          if-no-files-found: error
          retention-days: 14
