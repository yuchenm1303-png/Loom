name: Windows x86 Local Host Compatibility Probe

# Diagnostic workflow only. Does not publish or replace any Loom runtime.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/win32-local-host-probe.yml"
      - "pyproject.toml"
      - "win32-client/host-probe/**"

permissions:
  contents: read

jobs:
  python-x86:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86

      - name: Verify actual 32-bit Python environment
        shell: pwsh
        run: |
          python --version
          python -c "import struct, sys, platform; print('pointer bits:', struct.calcsize('P') * 8); print('executable:', sys.executable); assert struct.calcsize('P') == 4; assert platform.system() == 'Windows'"
          if ($LASTEXITCODE -ne 0) { throw "The runner did not initialize 32-bit Python." }
          python -m pip install --upgrade pip wheel

      - name: Resolve and install Loom core dependencies
        id: core
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "Core dependency installation failed on Windows x86." }
          python -c "import app, mcp, httpx, keyring; print('loom-x86-core-import-ok')"
          if ($LASTEXITCODE -ne 0) { throw "Core imports failed on Windows x86." }

      - name: Resolve and install Windows Computer Use dependencies
        id: computer
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -e ".[computer]"
          if ($LASTEXITCODE -ne 0) { throw "Computer Use dependencies are not installable on Windows x86." }
          python -c "import pyautogui, pywinauto, psutil, win32api; print('loom-x86-computer-import-ok')"
          if ($LASTEXITCODE -ne 0) { throw "Computer Use imports failed on Windows x86." }

      - name: Resolve browser and desktop-agent dependencies for x86
        id: browser
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --dry-run ".[desktop-agent]"
          if ($LASTEXITCODE -ne 0) { throw "Browser/desktop dependencies cannot be fully resolved for x86." }

      - name: Probe PyInstaller x86 runtime bootstrap
        id: freeze
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller cannot be installed for Windows x86." }
          Set-Content -Path win32-bootstrap-probe.py -Value "import struct; assert struct.calcsize('P') == 4; print('win32-frozen-runtime-ok')" -Encoding utf8
          python -m PyInstaller --noconfirm --clean --onedir --name loom-win32-bootstrap-probe win32-bootstrap-probe.py
          if ($LASTEXITCODE -ne 0) { throw "x86 PyInstaller bootstrap packaging failed." }
          & .\dist\loom-win32-bootstrap-probe\loom-win32-bootstrap-probe.exe
          if ($LASTEXITCODE -ne 0) { throw "x86 PyInstaller runtime bootstrap failed." }

      - name: Explain compatibility blockers without altering the x64 product
        if: always()
        shell: pwsh
        env:
          CORE: ${{ steps.core.outcome }}
          COMPUTER: ${{ steps.computer.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          FREEZE: ${{ steps.freeze.outcome }}
        run: |
          @"
          ## Loom Win32 local Host compatibility probe
          This is a 32-bit Python x86 dependency and bootstrap check, **not a full Win32 Agent release**.

          | Check | Outcome |
          | --- | --- |
          | Loom Python core | $env:CORE |
          | Windows Computer Use dependencies | $env:COMPUTER |
          | Desktop and browser dependency resolution | $env:BROWSER |
          | Frozen 32-bit Python bootstrap | $env:FREEZE |

          Existing Electron 44, Microsoft MXC x64, bundled Chrome x64, and Node/Electron Host integration remain separate blockers.
          The x64 release pipeline is not changed by this diagnostic workflow.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Fail the probe if core x86 support is unavailable
        if: always()
        shell: pwsh
        env:
          CORE: ${{ steps.core.outcome }}
          COMPUTER: ${{ steps.computer.outcome }}
          FREEZE: ${{ steps.freeze.outcome }}
        run: |
          if ($env:CORE -ne "success" -or $env:COMPUTER -ne "success" -or $env:FREEZE -ne "success") {
            throw "At least one local Host prerequisite is blocked on Windows x86. See the report above."
          }
