name: Windows Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  publish-windows-x64:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOOM_GITHUB_CLIENT_ID: ${{ vars.LOOM_GITHUB_CLIENT_ID }}
      LOOM_GITHUB_CLIENT_SECRET: ${{ secrets.LOOM_GITHUB_CLIENT_SECRET }}
      LOOM_GITHUB_OAUTH_SCOPES: ${{ vars.LOOM_GITHUB_OAUTH_SCOPES || 'repo read:org' }}
      LOOM_GITHUB_CALLBACK_PATH: ${{ vars.LOOM_GITHUB_CALLBACK_PATH || '/oauth/github/callback' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare release version
        id: release
        shell: pwsh
        run: |
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "desktop-react\package.json"
          $defaultBranch = "${{ github.event.repository.default_branch }}"

          if ("${{ github.ref_name }}" -ne $defaultBranch) {
            throw "Windows releases must be started from the default branch '$defaultBranch'. Choose '$defaultBranch' in the Run workflow branch selector."
          }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE "desktop-react")
          npm version "${{ inputs.bump }}" --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw "Failed to bump desktop package version." }
          Pop-Location

          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"

          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { throw "Failed to refresh release tags from origin." }
          $existingTags = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect local release tags." }
          if ($existingTags -contains $tag) {
            throw "Release tag $tag already exists. Refusing to overwrite an existing release."
          }

          $releaseTags = @(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect existing GitHub Releases." }
          if ($releaseTags -contains $tag) {
            throw "GitHub Release $tag already exists. Refusing to overwrite published updater assets."
          }

          Write-Host "Manual release prepared: $tag (${{ inputs.bump }} bump)"
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate trusted release OAuth configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_ID)) {
            throw "Missing Actions variable LOOM_GITHUB_CLIENT_ID."
          }
          if ([string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_SECRET)) {
            throw "Missing Actions secret LOOM_GITHUB_CLIENT_SECRET."
          }

      - name: Install desktop dependencies
        working-directory: desktop-react
        run: npm install --no-audit --no-fund

      - name: Build Windows release candidate
        working-directory: desktop-react
        run: npm run package:win

      - name: Verify release candidate
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "desktop-react\release"
          $installer = Get-ChildItem $releaseDir -Filter "Loom-Setup-*.exe" | Select-Object -First 1
          $metadata = Join-Path $releaseDir "latest.yml"
          $blockmap = Get-ChildItem $releaseDir -Filter "Loom-Setup-*.exe.blockmap" | Select-Object -First 1
          $resources = Join-Path $releaseDir "win-unpacked\resources"
          $runtime = Join-Path $resources "python.exe"
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "desktop-react\package.json"
          $packageVersion = (Get-Content $packagePath -Raw | ConvertFrom-Json).version

          if (-not $installer) { throw "Loom Setup executable was not produced." }
          if ($installer.Length -lt 1000000) { throw "Loom Setup executable is unexpectedly small: $($installer.Length) bytes" }
          if (-not (Test-Path $metadata)) { throw "latest.yml was not produced; installed clients would not discover this release." }
          if (-not $blockmap) { throw "NSIS blockmap was not produced." }
          if (-not (Test-Path $runtime)) { throw "Packaged private Python runtime was not found at $runtime" }

          $latest = Get-Content $metadata -Raw
          $expectedVersionLine = "version:\s+$([regex]::Escape($packageVersion))"
          if ($latest -notmatch $expectedVersionLine) {
            throw "latest.yml version does not match package.json."
          }

          $env:LOOM_SMOKE_HOST_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE "desktop-react/release/win-unpacked/Loom.exe"
          node (Join-Path $env:GITHUB_WORKSPACE "desktop-react/scripts/host-process-smoke.mjs")
          if ($LASTEXITCODE -ne 0) { throw "Clean packaged Host startup failed." }
          & $runtime first-run-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged credential-free first-run test failed." }
          & $runtime self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime self-test failed with exit code $LASTEXITCODE" }

          Write-Host "Release candidate verified: $($installer.Name)"

      - name: Commit version bump and publish release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $defaultBranch = "${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-react/package.json desktop-react/package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw "Release did not produce a package version change."
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Version bump contains invalid whitespace changes." }

          git commit -m "chore(release): Loom $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release version commit." }

          $candidateSha = (git rev-parse HEAD).Trim()
          $releaseBase = (git rev-parse "HEAD^").Trim()
          if ([string]::IsNullOrWhiteSpace($candidateSha) -or [string]::IsNullOrWhiteSpace($releaseBase)) {
            throw "Failed to resolve the immutable release candidate commit."
          }

          # The installer was built from this exact commit state. Keep the tag pinned
          # to it even if main advances while the expensive Windows build is running.
          git tag -a $env:RELEASE_TAG $candidateSha -m "Loom $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag $env:RELEASE_TAG." }

          $published = $false
          $maxPublishAttempts = 5
          for ($attempt = 1; $attempt -le $maxPublishAttempts; $attempt++) {
            git fetch origin $defaultBranch --tags
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh the default branch before publishing." }

            $remoteTags = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
            if ($LASTEXITCODE -ne 0) { throw "Failed to inspect remote release tags." }
            if ($remoteTags.Count -gt 0) {
              throw "Remote tag $env:RELEASE_TAG already exists. Refusing to overwrite it."
            }

            $remoteTip = (git rev-parse "origin/$defaultBranch").Trim()
            if ([string]::IsNullOrWhiteSpace($remoteTip)) {
              throw "Failed to resolve origin/$defaultBranch."
            }

            if ($remoteTip -eq $releaseBase) {
              # No source changes landed during the build. The candidate itself is
              # the next main commit, so no integration merge is necessary.
              $publishSha = $candidateSha
              git checkout --detach $candidateSha
              if ($LASTEXITCODE -ne 0) { throw "Failed to restore the release candidate commit." }
            }
            else {
              Write-Host "The default branch advanced during the build ($releaseBase -> $remoteTip). Integrating only the verified release version commit into the latest $defaultBranch."
              git checkout --detach $remoteTip
              if ($LASTEXITCODE -ne 0) { throw "Failed to check out the latest $defaultBranch before release integration." }

              git merge --no-ff $candidateSha -m "chore(release): integrate Loom $env:RELEASE_TAG"
              if ($LASTEXITCODE -ne 0) {
                git merge --abort 2>$null
                throw "The release version commit conflicts with changes that landed on $defaultBranch during the build. No release was published."
              }
              $publishSha = (git rev-parse HEAD).Trim()
            }

            # Publish the main update and immutable candidate tag together. If main
            # moves in the tiny fetch->push window, --atomic publishes neither ref;
            # retry from the new tip instead of throwing away the completed build.
            git push --atomic origin "$publishSha`:refs/heads/$defaultBranch" "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -eq 0) {
              $published = $true
              Write-Host "Published verified release candidate $candidateSha as $env:RELEASE_TAG (main -> $publishSha)."
              break
            }

            if ($attempt -lt $maxPublishAttempts) {
              Write-Warning "The default branch moved during publish attempt $attempt/$maxPublishAttempts. Retrying from the latest $defaultBranch without rebuilding the verified candidate."
              git checkout --detach $candidateSha
              if ($LASTEXITCODE -ne 0) { throw "Failed to restore the release candidate before retrying publish." }
              Start-Sleep -Seconds 2
            }
          }

          if (-not $published) {
            throw "Failed to atomically publish the release after $maxPublishAttempts attempts because $defaultBranch kept moving or the push was rejected. The verified candidate was not partially published."
          }

      - name: Publish GitHub release and updater metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "desktop-react\release"
          $installer = Get-ChildItem $releaseDir -Filter "Loom-Setup-*.exe" | Select-Object -First 1
          $metadata = Join-Path $releaseDir "latest.yml"
          $blockmap = Get-ChildItem $releaseDir -Filter "Loom-Setup-*.exe.blockmap" | Select-Object -First 1

          gh release create $env:RELEASE_TAG "$($installer.FullName)" "$($blockmap.FullName)" "$metadata" --verify-tag --title "Loom $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release $env:RELEASE_TAG." }

      - name: Verify published release assets
        id: published
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "desktop-react\release"
          $installer = Get-ChildItem $releaseDir -Filter "Loom-Setup-*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem $releaseDir -Filter "Loom-Setup-*.exe.blockmap" | Select-Object -First 1

          $assetNames = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not read back GitHub Release $env:RELEASE_TAG." }

          foreach ($expected in @($installer.Name, $blockmap.Name, "latest.yml")) {
            if ($assetNames -notcontains $expected) {
              throw "Published release is missing required updater asset: $expected"
            }
          }

          $releaseUrl = (gh release view $env:RELEASE_TAG --json url --jq '.url').Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseUrl)) {
            throw "Published release URL could not be resolved."
          }
          "url=$releaseUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Published release verified: $releaseUrl"

      - uses: actions/upload-artifact@v4
        with:
          name: Loom-Windows-Release-${{ steps.release.outputs.tag }}
          path: |
            desktop-react/release/Loom-Setup-*.exe
            desktop-react/release/Loom-Setup-*.exe.blockmap
            desktop-react/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Release summary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.published.outputs.url }}
        run: |
          @"
          ## Loom Windows release published

          - Version: `$env:RELEASE_VERSION`
          - Tag: `$env:RELEASE_TAG`
          - GitHub Release: $env:RELEASE_URL
          - Updater metadata: `latest.yml`
          - Installer and NSIS blockmap verified

          Installed updater-enabled Loom clients can now discover this version automatically.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
