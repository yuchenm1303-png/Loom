name: Apply auth UI polish patch

on:
  push:
    branches:
      - feat/auth-ui-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-ui-polish
          fetch-depth: 0
      - name: Apply staged patch and clean helper files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/_patches/auth-ui-polish.patch.gz.b64 | gzip -d > /tmp/auth-ui-polish.patch
          git apply --check /tmp/auth-ui-polish.patch
          git apply /tmp/auth-ui-polish.patch
          rm -f .github/_patches/auth-ui-polish.patch.gz.b64
          rm -f .github/workflows/apply-auth-ui-polish.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): polish account portal fields'
          git push origin HEAD:feat/auth-ui-polish
