name: Finalize Loom model gateway

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-model-gateway.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated gateway patch
        shell: bash
        run: |
          cat <<'PATCH64' | base64 -d | gzip -d > /tmp/gateway.patch
          
          PATCH64
          git apply --check /tmp/gateway.patch
          git apply /tmp/gateway.patch
          git diff --check
      - name: Validate focused tests
        shell: bash
        run: |
          python -m pip install -q -e '.[dev]'
          pytest -q tests/test_ant_ling_bridge.py tests/test_loom_admin.py tests/test_loom_model_gateway.py
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route Ant Ling through Loom model gateway'
          git push origin HEAD:main
