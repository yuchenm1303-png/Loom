name: Windows EXE Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-react/**"
      # build-windows-runtime.mjs collects the entire app package with
      # PyInstaller, so every app change can alter the packaged runtime.
      - "app/**"
      - "loom_*.py"
      # Electron ships this extension as an extraResource.
      - "extensions/browser-current-tab/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/windows-package.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "desktop-react/**"
      - "app/**"
      - "loom_*.py"
      - "extensions/browser-current-tab/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: read

jobs:
  package-windows-x64:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Production OAuth application material is available only to trusted
      # push/manual builds. Pull-request code never receives the release secret.
      LOOM_GITHUB_CLIENT_ID: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.LOOM_GITHUB_CLIENT_ID || '' }}
      LOOM_GITHUB_CLIENT_SECRET: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.LOOM_GITHUB_CLIENT_SECRET || '' }}
      LOOM_GITHUB_OAUTH_SCOPES: ${{ vars.LOOM_GITHUB_OAUTH_SCOPES || 'repo read:org' }}
      LOOM_GITHUB_CALLBACK_PATH: ${{ vars.LOOM_GITHUB_CALLBACK_PATH || '/oauth/github/callback' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate trusted release OAuth configuration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_ID)) {
            throw "Missing Actions variable LOOM_GITHUB_CLIENT_ID; refusing to build a trusted Loom release that would fall back to device-code login."
          }
          if ([string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_SECRET)) {
            throw "Missing Actions secret LOOM_GITHUB_CLIENT_SECRET; refusing to build a trusted Loom release that would fall back to device-code login."
          }
          Write-Host "GitHub Web OAuth release configuration is present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: desktop-react
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop-react
        run: npm run package:win

      - name: Verify packaged private runtime
        shell: pwsh
        run: |
          $resources = Join-Path $env:GITHUB_WORKSPACE "desktop-react\release\win-unpacked\resources"
          $runtime = Join-Path $resources "python.exe"
          $mxc = Join-Path $resources "wxc-exec.exe"
          $browserExtension = Join-Path $resources "browser-current-tab\manifest.json"
          if (-not (Test-Path $runtime)) { throw "Packaged private Python runtime was not found at $runtime" }
          if (-not (Test-Path $mxc)) { throw "Packaged MXC executable was not found at $mxc" }
          if (-not (Test-Path $browserExtension)) { throw "Packaged Current Tab Bridge extension was not found at $browserExtension" }
          & $runtime self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime self-test failed with exit code $LASTEXITCODE" }
          & $runtime -c "import app; import mcp; from mcp.client.streamable_http import streamable_http_client; from app.app_server_local_ipc import LoomLocalAppServerClient; from app.chatgpt_mcp import build_mcp_server; import loom_chatgpt_mcp; print('loom-runtime-import-ok')"
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime import smoke failed with exit code $LASTEXITCODE" }
          & $runtime loom_chatgpt_mcp.py --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged ChatGPT MCP entrypoint smoke failed with exit code $LASTEXITCODE" }

          $oauthConfigured = (-not [string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_ID)) -and (-not [string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_SECRET))
          if ($oauthConfigured) { $env:LOOM_EXPECT_PACKAGED_GITHUB_OAUTH = "1" } else { $env:LOOM_EXPECT_PACKAGED_GITHUB_OAUTH = "0" }
          $savedClientId = $env:LOOM_GITHUB_CLIENT_ID
          $savedClientSecret = $env:LOOM_GITHUB_CLIENT_SECRET
          $savedScopes = $env:LOOM_GITHUB_OAUTH_SCOPES
          $savedCallback = $env:LOOM_GITHUB_CALLBACK_PATH
          Remove-Item Env:LOOM_GITHUB_CLIENT_ID -ErrorAction SilentlyContinue
          Remove-Item Env:LOOM_GITHUB_CLIENT_SECRET -ErrorAction SilentlyContinue
          Remove-Item Env:LOOM_GITHUB_OAUTH_SCOPES -ErrorAction SilentlyContinue
          Remove-Item Env:LOOM_GITHUB_CALLBACK_PATH -ErrorAction SilentlyContinue
          & $runtime -c "import os,tempfile; from pathlib import Path; import keyring.backends.Windows; from app.connector_web_oauth import WebOAuthConnectorManager; m=WebOAuthConnectorManager(Path(tempfile.mkdtemp())); s=m.github_status(); expected=os.environ.get('LOOM_EXPECT_PACKAGED_GITHUB_OAUTH')=='1'; assert s.get('id')=='github'; assert bool(s.get('webOAuthAvailable')) is expected; print('loom-frozen-connector-status-ok', 'web-oauth-ready='+str(expected).lower())"
          if ($LASTEXITCODE -ne 0) { throw "Packaged GitHub Connector smoke failed with exit code $LASTEXITCODE" }
          $env:LOOM_GITHUB_CLIENT_ID = $savedClientId
          $env:LOOM_GITHUB_CLIENT_SECRET = $savedClientSecret
          $env:LOOM_GITHUB_OAUTH_SCOPES = $savedScopes
          $env:LOOM_GITHUB_CALLBACK_PATH = $savedCallback
          Remove-Item Env:LOOM_EXPECT_PACKAGED_GITHUB_OAUTH -ErrorAction SilentlyContinue

          & $runtime (Join-Path $resources "loom_model_bridge.py") list
          if ($LASTEXITCODE -ne 0) { throw "Packaged model bridge compatibility smoke failed with exit code $LASTEXITCODE" }
          & $runtime (Join-Path $resources "loom_model_admin.py") metadata
          if ($LASTEXITCODE -ne 0) { throw "Packaged model admin compatibility smoke failed with exit code $LASTEXITCODE" }

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\desktop-react\release\Loom-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Loom Setup executable was not produced" }
          if ($installer.Length -lt 1000000) { throw "Loom Setup executable is unexpectedly small: $($installer.Length) bytes" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Loom-Windows-x64
          path: desktop-react/release/Loom-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
