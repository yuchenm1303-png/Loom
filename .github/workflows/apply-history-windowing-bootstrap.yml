name: Apply history windowing bootstrap

on:
  push:
    branches:
      - perf/conversation-history-windowing
    paths:
      - .github/loom-history-windowing.patch
      - .github/workflows/apply-history-windowing-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/loom-history-windowing.patch
          git apply .github/loom-history-windowing.patch
          rm .github/loom-history-windowing.patch
          rm .github/workflows/apply-history-windowing-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf(web): window long conversation history"
          git push origin HEAD:${GITHUB_REF_NAME}
