name: Finalize independent Loom Host runtime

on:
  push:
    branches:
      - automation/host-runtime-channel-v2
    paths:
      - .github/apply-host-runtime-channel.py
      - .github/workflows/finalize-host-runtime-channel.yml

permissions:
  contents: write

concurrency:
  group: finalize-host-runtime-channel-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/host-runtime-channel-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply runtime separation transform
        run: python .github/apply-host-runtime-channel.py

      - name: Run Host and Web contracts
        run: |
          python -m pip install --quiet -e '.[dev,browser]'
          python -m pytest -q \
            tests/test_loom_host_background_runtime.py \
            tests/test_loom_web_local_host_contract.py \
            tests/test_loom_web_local_first_contract.py \
            tests/test_web_host_launch_onboarding.py \
            tests/test_host_runtime_distribution.py

      - name: Build Desktop bootstrap and Web renderer
        working-directory: desktop-react
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Publish clean runtime separation commit
        run: |
          rm -f .github/apply-host-runtime-channel.py
          rm -f .github/workflows/finalize-host-runtime-channel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Decouple Loom Host runtime updates from Desktop"
          git push origin HEAD:automation/host-runtime-channel-v2
