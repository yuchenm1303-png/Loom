name: Route Desktop Bootstrap Changes
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: desktop-bootstrap-router
  cancel-in-progress: false
jobs:
  route:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Route validated native changes to installer release
        shell: bash
        run: |
          git fetch origin main
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- desktop-react/electron desktop-react/build desktop-react/package.json desktop-react/package-lock.json; then exit 0; fi
          message="$(git log -1 --format=%s)"
          if [[ "$message" == chore\(release\)* || "$message" == chore\(host\)* || "$message" == chore\(ui\)* ]]; then exit 0; fi
          files="$(git diff-tree --no-commit-id --name-only -r "$SOURCE_SHA")"
          if ! printf '%s\n' "$files" | grep -Eq '^desktop-react/(electron/.*\.(ts|cts)|build/|scripts/(packaged|build-windows|setup-|windows-installer|verify-packaged|host-process)|package(-lock)?\.json)'; then exit 0; fi
          gh workflow run windows-release.yml --ref main -f bump=patch
