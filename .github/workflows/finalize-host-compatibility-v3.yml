name: Finalize Loom Web Host compatibility v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare Loom Web Host compatibility v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply validated Host compatibility patch
        shell: bash
        run: |
          base64 -d .github/host-compatibility.patch.gz.b64 | gzip -dc > /tmp/host-compat.patch
          git apply --exclude=tests/test_loom_web_local_first_contract.py --exclude=tests/test_loom_web_local_host_contract.py --check /tmp/host-compat.patch
          git apply --exclude=tests/test_loom_web_local_first_contract.py --exclude=tests/test_loom_web_local_host_contract.py /tmp/host-compat.patch
          git diff --check
      - name: Python contract tests
        run: python -m pytest -q tests/test_loom_web_local_host_contract.py tests/test_loom_web_local_first_contract.py
      - name: Install renderer dependencies
        working-directory: desktop-react
        run: npm ci --no-audit --no-fund
      - name: Renderer and Electron typecheck
        working-directory: desktop-react
        run: npm run typecheck
      - name: Publish Host compatibility
        shell: bash
        run: |
          git rm -f .github/host-compatibility.patch.gz.b64
          git rm -f .github/workflows/finalize-host-compatibility.yml
          git rm -f .github/workflows/finalize-host-compatibility-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop-react/electron/remoteRelay.ts \
                  desktop-react/electron/updater.ts \
                  desktop-react/electron/webRelayAuth.ts \
                  desktop-react/src/components/WebAppGate.tsx \
                  desktop-react/src/localHostDiscovery.ts \
                  desktop-react/src/webBridge.ts
          git commit -m 'Keep Loom Web Host runtime compatible'
          git push origin HEAD:main
