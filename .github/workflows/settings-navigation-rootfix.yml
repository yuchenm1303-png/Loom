name: Settings navigation root fix

on:
  push:
    branches:
      - fix/settings-navigation-root
    paths:
      - .github/workflows/settings-navigation-rootfix.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-react/package-lock.json
      - name: Refactor settings routing
        run: python3 .github/scripts/settings-navigation-rootfix.py
      - name: Check diff
        run: git diff --check
      - name: Typecheck desktop
        working-directory: desktop-react
        run: |
          npm ci --ignore-scripts
          npm run typecheck
      - name: Commit root fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/settings-navigation-rootfix.yml .github/scripts/settings-navigation-rootfix.py
          git add desktop-react/src/components/SettingsPage.tsx \
                  desktop-react/src/components/SettingsMemoryBridge.tsx \
                  desktop-react/src/components/SettingsConnectorsBridge.tsx \
                  desktop-react/src/components/SettingsComputerLogExport.tsx \
                  desktop-react/src/components/settings-memory.css \
                  desktop-react/src/components/settingsNavigation.ts
          git commit -m "Unify settings navigation state"
          git push origin HEAD:fix/settings-navigation-root
