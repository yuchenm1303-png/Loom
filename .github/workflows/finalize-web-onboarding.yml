name: Finalize first-run Loom Host onboarding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Prepare first-run Loom Host onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply first-run onboarding patch
        shell: bash
        run: |
          base64 -d .github/web-onboarding.patch.gz.b64 | gzip -dc > /tmp/web-onboarding.patch
          git apply --check /tmp/web-onboarding.patch
          git apply /tmp/web-onboarding.patch
          git diff --check
      - name: Install renderer dependencies
        working-directory: desktop-react
        run: npm ci --no-audit --no-fund
      - name: Typecheck renderer and Electron
        working-directory: desktop-react
        run: npm run typecheck
      - name: Publish onboarding
        shell: bash
        run: |
          git rm -f .github/web-onboarding.patch.gz.b64
          git rm -f .github/workflows/finalize-web-onboarding.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop-react/src/components/WebPortal.tsx \
                  desktop-react/src/components/portal-host-card.css
          git commit -m 'Guide new Loom Web users through Host setup'
          git push origin HEAD:main
