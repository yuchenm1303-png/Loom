name: Finalize Loom Host shell identity

on:
  push:
    branches:
      - fix/host-taskbar-tray-identity
    paths:
      - ".github/apply-host-shell-identity.py"
      - ".github/workflows/finalize-host-shell-identity.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply shell identity polish
        run: python .github/apply-host-shell-identity.py

      - name: Host shell contract
        run: python -c "import runpy; ns=runpy.run_path('tests/test_host_shell_identity.py'); ns['test_background_host_uses_single_loom_identity']()"

      - name: Install desktop dependencies
        working-directory: desktop-react
        run: npm install --no-audit --no-fund

      - name: Typecheck and build desktop
        working-directory: desktop-react
        run: |
          npm run typecheck
          npm run build

      - name: Publish clean implementation commit
        shell: bash
        run: |
          rm -f .github/apply-host-shell-identity.py .github/workflows/finalize-host-shell-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "fix(host): unify Loom taskbar and tray identity"
          git push origin HEAD:fix/host-taskbar-tray-identity
