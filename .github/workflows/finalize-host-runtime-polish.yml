name: Finalize Loom Host runtime polish

on:
  push:
    branches:
      - automation/host-runtime-polish
    paths:
      - .github/apply-host-runtime-polish.py
      - .github/workflows/finalize-host-runtime-polish.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/host-runtime-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply polish
        run: python .github/apply-host-runtime-polish.py
      - name: Host contracts
        run: |
          python -m pip install --quiet -e '.[dev,browser]'
          python -m pytest -q tests/test_host_runtime_distribution.py tests/test_loom_host_background_runtime.py tests/test_loom_web_local_host_contract.py
      - name: Typecheck and build
        working-directory: desktop-react
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Publish clean polish commit
        run: |
          rm -f .github/apply-host-runtime-polish.py
          rm -f .github/workflows/finalize-host-runtime-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish independent Loom Host runtime activation"
          git push origin HEAD:automation/host-runtime-polish
