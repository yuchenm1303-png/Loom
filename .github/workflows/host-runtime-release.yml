name: Loom Host Runtime Release

on:
  # Source commits run CI; publish a tested batch explicitly from Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loom-host-runtime-stable
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Keep these steps identical to the `test` job in ci.yml (see
    # tests/test_host_release_gate.py). A stuck test must not hold a release for
    # the 6 h default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,browser]' -r services/loom_web_gateway/requirements.txt
      - name: Compile
        run: python -m compileall -q app loom_cli.py loom_web.py loom_app_server.py loom_chatgpt_mcp.py run_loom.py
      - name: Validate Loom Web deployment script
        run: bash -n scripts/deploy-loom-web-main.sh && bash -n scripts/loom-web-autosync-entry.sh
      - name: Test
        # --verbosity=1 overrides the -q in pyproject so every test is named in the
        # log. faulthandler_timeout dumps every thread's stack when a single test
        # runs for two minutes, so a hang identifies its own blocking call.
        run: python -m pytest --verbosity=1 -o faulthandler_timeout=120
      - name: CLI smoke
        run: |
          loom --help
          loom-web --help
          loom-app-server --help
          loom-chatgpt-mcp --help

  publish-host-runtime:
    needs: test
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOOM_GITHUB_CLIENT_ID: ${{ vars.LOOM_GITHUB_CLIENT_ID }}
      LOOM_GITHUB_CLIENT_SECRET: ${{ secrets.LOOM_GITHUB_CLIENT_SECRET }}
      LOOM_GITHUB_OAUTH_SCOPES: ${{ vars.LOOM_GITHUB_OAUTH_SCOPES || 'repo read:org' }}
      LOOM_GITHUB_CALLBACK_PATH: ${{ vars.LOOM_GITHUB_CALLBACK_PATH || '/oauth/github/callback' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/windows-build-setup

      - name: Resolve Host runtime version
        id: runtime
        shell: pwsh
        run: |
          $config = Get-Content (Join-Path $env:GITHUB_WORKSPACE "host-runtime\runtime.json") -Raw | ConvertFrom-Json
          if ($config.schema -ne 1) { throw "Unsupported Host runtime config schema." }
          $series = [string]$config.series
          if ($series -notmatch '^\d+\.\d+$') { throw "Invalid Host runtime series: $series" }
          $identity = node desktop-react/scripts/host-runtime-identity.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to resolve Host source identity." }
          $version = [string]$identity.version
          $tag = "host-v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "protocol=$($config.protocol)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "min_bootstrap=$($config.minBootstrapVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate trusted runtime configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_ID)) { throw "Missing LOOM_GITHUB_CLIENT_ID." }
          if ([string]::IsNullOrWhiteSpace($env:LOOM_GITHUB_CLIENT_SECRET)) { throw "Missing LOOM_GITHUB_CLIENT_SECRET." }

      - name: Install Desktop build dependencies
        working-directory: desktop-react
        run: npm ci --no-audit --no-fund

      - name: Build frozen Host runtime
        working-directory: desktop-react
        env:
          LOOM_HOST_RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
          LOOM_HOST_RUNTIME_PROTOCOL: ${{ steps.runtime.outputs.protocol }}
          LOOM_HOST_MIN_BOOTSTRAP_VERSION: ${{ steps.runtime.outputs.min_bootstrap }}
        run: npm run build:runtime:win

      - name: Package standalone Host runtime
        working-directory: desktop-react
        run: >-
          node scripts/package-host-runtime.mjs
          --version=${{ steps.runtime.outputs.version }}
          --protocol=${{ steps.runtime.outputs.protocol }}
          --min-bootstrap=${{ steps.runtime.outputs.min_bootstrap }}
          --source-sha=${{ github.sha }}

      - name: Verify standalone Host runtime
        shell: pwsh
        run: |
          $version = "${{ steps.runtime.outputs.version }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "desktop-react\host-runtime-release"
          $archive = Join-Path $releaseDir "Loom-Host-Runtime-$version-win-x64.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "loom-host-runtime-verify"
          if (-not (Test-Path $archive)) { throw "Host runtime archive was not produced." }
          Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $verifyDir -Force
          foreach ($required in @("python.exe", "wxc-exec.exe", "manifest.json", "browser-current-tab\manifest.json")) {
            if (-not (Test-Path (Join-Path $verifyDir $required))) { throw "Host runtime is missing $required" }
          }
          & (Join-Path $verifyDir "python.exe") first-run-test
          if ($LASTEXITCODE -ne 0) { throw "Host credential-free first-run test failed." }
          & (Join-Path $verifyDir "python.exe") self-test
          if ($LASTEXITCODE -ne 0) { throw "Standalone Host runtime self-test failed." }
          $manifest = Get-Content (Join-Path $verifyDir "manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "Host runtime manifest version mismatch." }
          if ([int]$manifest.protocol -ne [int]"${{ steps.runtime.outputs.protocol }}") { throw "Host runtime manifest protocol mismatch." }
          $extensionSource = Join-Path $env:GITHUB_WORKSPACE "extensions\browser-current-tab"
          Get-ChildItem $extensionSource -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($extensionSource, $_.FullName)
            $installed = Join-Path (Join-Path $verifyDir "browser-current-tab") $relative
            if (-not (Test-Path $installed) -or (Get-FileHash $_.FullName).Hash -ne (Get-FileHash $installed).Hash) {
              throw "Host extension asset mismatch: $relative"
            }
          }

      - name: Publish immutable Host runtime prerelease
        shell: pwsh
        env:
          RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
        run: |
          $version = "${{ steps.runtime.outputs.version }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "desktop-react\host-runtime-release"
          $archive = Join-Path $releaseDir "Loom-Host-Runtime-$version-win-x64.zip"
          $manifest = Join-Path $releaseDir "host-runtime-manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if (-not (git tag --list $env:RUNTIME_TAG)) {
            git tag -a $env:RUNTIME_TAG $env:GITHUB_SHA -m "Loom Host Runtime $version"
            git push origin "refs/tags/$env:RUNTIME_TAG"
          }
          $existing = gh release view $env:RUNTIME_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RUNTIME_TAG $archive $manifest --clobber
          } else {
            gh release create $env:RUNTIME_TAG $archive $manifest --verify-tag --prerelease --title "Loom Host Runtime $version" --notes "Independent Loom Host runtime. Install/upgrade is handled by the Loom Host bootstrap; this prerelease is not a Desktop release."
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish Host runtime prerelease." }

      - name: Advance stable Host channel
        shell: pwsh
        env:
          RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
        run: |
          $version = "${{ steps.runtime.outputs.version }}"
          $protocol = [int]"${{ steps.runtime.outputs.protocol }}"
          $minBootstrap = "${{ steps.runtime.outputs.min_bootstrap }}"
          $archiveName = "Loom-Host-Runtime-$version-win-x64.zip"
          $archive = Join-Path $env:GITHUB_WORKSPACE "desktop-react\host-runtime-release\$archiveName"
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $size = (Get-Item $archive).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RUNTIME_TAG/$archiveName"
          $channel = [ordered]@{
            schema = 1
            channel = "stable"
            version = $version
            protocol = $protocol
            minBootstrapVersion = $minBootstrap
            url = $url
            sha256 = $sha
            size = $size
            sourceSha = "${{ github.sha }}"
            publishedAt = (Get-Content (Join-Path $env:GITHUB_WORKSPACE "desktop-react\host-runtime-release\host-runtime-manifest.json") -Raw | ConvertFrom-Json).publishedAt
          } | ConvertTo-Json

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          $channelPath = Join-Path $env:GITHUB_WORKSPACE "host-runtime\stable.json"
          [IO.File]::WriteAllText($channelPath, $channel + "`n", [Text.UTF8Encoding]::new($false))
          git add host-runtime/stable.json
          if (git diff --cached --quiet) {
            Write-Host "Stable Host channel already points at $version."
            exit 0
          }
          git commit -m "chore(host): advance runtime stable channel to $version"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to advance Host stable channel; rerun this workflow after main settles." }

      - uses: actions/upload-artifact@v4
        with:
          name: Loom-Host-Runtime-${{ steps.runtime.outputs.version }}
          path: |
            desktop-react/host-runtime-release/Loom-Host-Runtime-*-win-x64.zip
            desktop-react/host-runtime-release/host-runtime-manifest.json
          if-no-files-found: error
          retention-days: 30
