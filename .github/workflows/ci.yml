name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app loom_cli.py run_loom.py
      - name: Test
        run: python -m pytest
      - name: CLI smoke
        run: loom --help

  browser-adapter-smoke:
    runs-on: ubuntu-latest
    env:
      # browser-use 0.13.x reads IN_DOCKER to enable its documented Chromium
      # container launch flags (including --no-sandbox). GitHub-hosted runners
      # otherwise look like a regular Linux host even though Chrome requires the
      # container-style launch policy in this test environment.
      IN_DOCKER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser extra
        run: python -m pip install -e '.[dev,browser]'
      - name: Browser-use adapter contract
        run: python -m pytest -q tests/test_browser_use_compat.py
