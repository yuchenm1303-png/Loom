name: Granular Retry Component Trace

on:
  pull_request:

permissions:
  contents: read

jobs:
  granular-retry-component-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Trace binding components around exact pytest retry
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import marshal
          import pytest

          from app.agent_runtime.execution_action import exec_environment_identity, execution_action_for
          from app.agent_runtime.execution_binding import action_binding_digest as real_action_binding_digest
          from app.agent_runtime.json_schema_semantics import validating_schema
          import app.agent_runtime.runtime as runtime_module
          import app.agent_runtime.sandbox_runtime as sandbox_runtime_module
          import app.agent_runtime.turn_runner as turn_runner_module

          records = []

          def stable_hash(value):
              raw = json.dumps(value, sort_keys=True, default=str, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def projection(step, tool, call):
              handler = tool.handler
              function = getattr(handler, "__func__", handler)
              code = getattr(function, "__code__", None)
              closure = []
              for cell in (getattr(function, "__closure__", None) or ()):
                  value = cell.cell_contents
                  if isinstance(value, (str, int, float, bool, type(None))):
                      closure.append(value)
                  elif hasattr(value, "config"):
                      closure.append(repr(value.config))
              action = execution_action_for(step, call)
              components = {
                  "workspace": step.world_state.workspace_dir,
                  "profile": step.world_state.profile_id,
                  "environment_policy_repr": repr(step.environment_policy),
                  "exec_environment_identity": exec_environment_identity(step),
                  "permission": {
                      "mode": step.permissions.mode.value,
                      "effects": sorted(x.value for x in step.permissions.profile.allowed_effects),
                      "approval": step.permissions.approval_policy.value,
                      "filesystem": step.permissions.file_system_access.value,
                  },
                  "sandbox": step.world_state.sandbox.to_dict() if step.world_state.sandbox else None,
                  "tool": tool.name,
                  "binding_key": tool.binding_key,
                  "defaults": repr(getattr(function, "__kwdefaults__", None)),
                  "schema": validating_schema(tool.input_schema),
                  "effect": tool.effect.value,
                  "handler": f"{getattr(function, '__module__', '')}:{getattr(function, '__qualname__', '')}",
                  "code_hash": hashlib.sha256(marshal.dumps(code)).hexdigest() if code else str(type(handler)),
                  "request_state": step.request_state.digest() if step.request_state.captured else None,
                  "closure": closure,
                  "typed_action_digest": action.digest() if action is not None else None,
              }
              return components

          def traced(step, tool, call, platform):
              digest = real_action_binding_digest(step, tool, call, platform)
              components = projection(step, tool, call)
              record = {
                  "index": len(records),
                  "digest": digest,
                  "component_hashes": {key: stable_hash(value) for key, value in components.items()},
                  "components": components,
              }
              records.append(record)
              print("COMPONENT_TRACE=" + json.dumps(record, sort_keys=True), flush=True)
              return digest

          turn_runner_module.action_binding_digest = traced
          runtime_module.action_binding_digest = traced
          sandbox_runtime_module.action_binding_digest = traced

          code = pytest.main([
              "-q",
              "-s",
              "tests/test_sandbox_escalation_runtime.py::test_granular_retry_without_prior_approval_requires_fresh_review",
          ])
          if len(records) >= 3:
              before = records[1]["component_hashes"]
              after = records[2]["component_hashes"]
              changed = {key: [before.get(key), after.get(key)] for key in sorted(set(before) | set(after)) if before.get(key) != after.get(key)}
              print("CHANGED_COMPONENTS=" + json.dumps(changed, sort_keys=True), flush=True)
          raise SystemExit(int(code))
          PY
