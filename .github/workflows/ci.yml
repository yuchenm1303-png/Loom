name: Granular Retry Focused Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  granular-retry-focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run exact granular retry contract
        run: python -m pytest -q tests/test_sandbox_escalation_runtime.py::test_granular_retry_without_prior_approval_requires_fresh_review
