name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,browser]'
      - name: Compile
        run: python -m compileall -q app loom_cli.py loom_web.py loom_app_server.py run_loom.py
      - name: Test
        run: python -m pytest
      - name: CLI smoke
        run: |
          loom --help
          loom-web --help
          loom-app-server --help

  react-desktop-smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check UFO desktop scripts
        run: node --check scripts/setup-ufo.mjs && node --check scripts/ufo-preflight.mjs
      - name: Install React desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck React desktop
        run: npm run typecheck
      - name: Build React desktop
        run: npm run build

  windows-context-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Runtime state path contract
        run: python -m pytest -q tests/test_context_runtime.py::test_model_request_contains_authoritative_runtime_state

  windows-exec-pty-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unified Exec and real ConPTY contracts
        run: python -m pytest -q tests/test_unified_exec_pty.py

  windows-sandbox-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Loom and Microsoft MXC
        run: |
          python -m pip install -e ".[dev]"
          npm install --no-save @microsoft/mxc-sdk@0.8.0
      - name: Locate and probe MXC
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          $exe = Join-Path $env:GITHUB_WORKSPACE "node_modules\@microsoft/mxc-sdk\bin\$arch\wxc-exec.exe"
          if (-not (Test-Path $exe)) { throw "MXC wxc-exec.exe was not installed at $exe" }
          & $exe --probe
          if ($LASTEXITCODE -ne 0) { throw "MXC platform probe failed with exit code $LASTEXITCODE" }
          "LOOM_WINDOWS_SANDBOX_EXECUTABLE=$exe" >> $env:GITHUB_ENV
      - name: Windows MXC policy and enforcement contracts
        run: python -m pytest -q tests/test_sandbox_runtime.py tests/test_windows_mxc_integration.py

  windows-computer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Computer Use extra
        run: python -m pip install -e ".[dev,computer]"
      - name: Computer Use and UFO driver contracts
        run: python -m pytest -q tests/test_computer_runtime.py tests/test_computer_grounding.py tests/test_computer_ufo_driver.py tests/test_computer_driver_hud.py
      - name: Windows adapter imports
        run: python -c "from app.agent_runtime.computer_windows import windows_computer_available; assert windows_computer_available()"

  windows-app-server-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: App-server process and UTF-8 protocol contracts
        run: python -m pytest -q tests/test_app_server_client.py tests/test_app_server_stdio_encoding.py
      - name: GitHub connector and Windows credential backend
        shell: pwsh
        run: |
          python -c "import keyring.backends.Windows; from app.connector_oauth_refresh import RefreshingConnectorManager; print('loom-github-connector-windows-ok')"
          python -m pytest -q tests/test_connector_product_config.py tests/test_connector_app_server.py

  mcp-adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP extra
        run: python -m pip install -e '.[dev,mcp]'
      - name: MCP SDK v2 adapter contract
        run: python -m pytest -q tests/test_mcp_sdk_compat.py

  browser-adapter-smoke:
    runs-on: ubuntu-latest
    env:
      # browser-use 0.13.x reads IN_DOCKER to enable its documented Chromium
      # container launch flags (including --no-sandbox). GitHub-hosted runners
      # otherwise look like a regular Linux host even though Chrome requires the
      # container-style launch policy in this test environment.
      IN_DOCKER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser extra
        run: python -m pip install -e '.[dev,browser]'
      - name: Browser-use adapter, interaction, profile, and CDP contracts
        run: python -m pytest -q tests/test_browser_use_compat.py tests/test_browser_actor_contract.py tests/test_browser_interaction_tools.py tests/test_browser_persistent_profile.py tests/test_browser_cdp_attach.py
