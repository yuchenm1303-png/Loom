name: Granular Binding Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  granular-binding-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Trace granular sandbox retry binding identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import runpy
          import tempfile
          import traceback
          from pathlib import Path

          from app.agent_runtime import AgentStatus
          from app.agent_runtime.execution_action import execution_action_for
          from app.agent_runtime.execution_binding import (
              action_binding_digest as real_action_binding_digest,
              binding_digest,
          )
          from app.agent_runtime.permissions import ApprovalPolicy, GranularApprovalConfig
          from app.agent_runtime.sandbox_attempt import (
              SandboxAttemptKind,
              current_sandbox_attempt,
          )
          from app.agent_runtime.sandbox_failure import SandboxExecutionError, SandboxFailureKind
          import app.agent_runtime.runtime as runtime_module
          import app.agent_runtime.sandbox_runtime as sandbox_runtime_module
          import app.agent_runtime.turn_runner as turn_runner_module

          helpers = runpy.run_path("tests/test_sandbox_escalation_runtime.py")
          runtime_factory = helpers["_runtime"]
          session_factory = helpers["_session"]

          key = "LOOM_GRANULAR_RETRY_ENV"
          original = os.environ.get(key)
          os.environ[key] = "sampled"
          attempts = []
          records = []

          def traced(step, tool, call, platform):
              digest = real_action_binding_digest(step, tool, call, platform)
              action = execution_action_for(step, call)
              records.append(
                  {
                      "digest": digest,
                      "base_digest": binding_digest(step, tool, platform),
                      "action_digest": action.digest() if action is not None else None,
                      "resolved_environment_identity": getattr(
                          action, "resolved_environment_identity", None
                      ),
                      "request_state_digest": (
                          step.request_state.digest() if step.request_state.captured else None
                      ),
                      "frozen_test_env": step.environment_policy.build().get(key),
                      "tool_binding_key": tool.binding_key,
                  }
              )
              return digest

          turn_runner_module.action_binding_digest = traced
          runtime_module.action_binding_digest = traced
          sandbox_runtime_module.action_binding_digest = traced

          def handler(_context, _arguments):
              attempt = current_sandbox_attempt()
              attempts.append(attempt)
              if attempt.kind is SandboxAttemptKind.INITIAL:
                  os.environ[key] = "changed-after-denial"
                  raise SandboxExecutionError(
                      SandboxFailureKind.DENIED,
                      "sandbox rejected an otherwise allowed action",
                      escalatable=True,
                  )
              from app.agent_runtime import ToolResult
              return ToolResult(ok=True, content="reviewed retry succeeded")

          root = Path(tempfile.mkdtemp(prefix="loom-granular-binding-"))
          runtime = runtime_factory(
              root,
              handler,
              "done",
              approval_policy=ApprovalPolicy.GRANULAR,
              granular=GranularApprovalConfig(sandbox_approval=True, rules=False),
          )
          try:
              session = session_factory(runtime, root)
              waiting = runtime.start_turn(session.session_id, "Run the action.")
              assert waiting.status is AgentStatus.WAITING_APPROVAL, waiting

              loaded = runtime.store.load(session.session_id)
              assert loaded.pending_tool_calls
              call = loaded.pending_tool_calls[0]
              step = runtime._captured_step_context(loaded)
              selected = step.tool_router.get(call.name)
              expected = loaded.pending_bindings.get(call.call_id)
              actual = (
                  traced(step, selected, call, runtime.platform)
                  if selected is not None
                  else None
              )

              print(
                  "PENDING_STATE="
                  + json.dumps(
                      {
                          "selected_present": selected is not None,
                          "expected_present": bool(expected),
                          "expected": expected,
                          "manual_actual": actual,
                          "pending_kind": (
                              loaded.pending_approval.kind.value
                              if loaded.pending_approval is not None
                              else None
                          ),
                          "pending_step_id": loaded.pending_step_id,
                          "call_id": call.call_id,
                          "call_name": call.name,
                      },
                      sort_keys=True,
                  )
              )
              print("TRACE_RECORDS=" + json.dumps(records, sort_keys=True))

              completed = runtime.resume_approval(
                  session.session_id,
                  "exec-1",
                  approved=True,
              )
              print(
                  "RESUME_RESULT="
                  + json.dumps(
                      {
                          "status": completed.status.value,
                          "attempt_kinds": [attempt.kind.value for attempt in attempts],
                      },
                      sort_keys=True,
                  )
              )
              assert completed.status is AgentStatus.COMPLETED
              assert [attempt.kind for attempt in attempts] == [
                  SandboxAttemptKind.INITIAL,
                  SandboxAttemptKind.RETRY,
              ]
          except Exception:
              print("TRACE_RECORDS_AT_FAILURE=" + json.dumps(records, sort_keys=True))
              traceback.print_exc()
              raise
          finally:
              runtime.close()
              if original is None:
                  os.environ.pop(key, None)
              else:
                  os.environ[key] = original
          PY
