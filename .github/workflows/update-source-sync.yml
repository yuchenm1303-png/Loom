name: Sync Update Download Source
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Windows Release, Windows Release On Version Commit, Loom Application Update, Loom UI Resource Update, Loom Host Runtime Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: loom-update-source-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.LOOM_UPDATE_SOURCE_URL != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOOM_UPDATE_SOURCE_URL: ${{ vars.LOOM_UPDATE_SOURCE_URL }}
      LOOM_UPDATE_BUCKET: ${{ vars.LOOM_UPDATE_BUCKET }}
      LOOM_UPDATE_PREFIX: ${{ vars.LOOM_UPDATE_PREFIX }}
      LOOM_UPDATE_S3_ENDPOINT: ${{ vars.LOOM_UPDATE_S3_ENDPOINT }}
      AWS_DEFAULT_REGION: ${{ vars.LOOM_UPDATE_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.LOOM_UPDATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.LOOM_UPDATE_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-react/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop-react
      - run: npm run build:electron
        working-directory: desktop-react
      - run: python -m pip install 'awscli>=1.36,<2'
      - name: Verify and mirror assets before publishing channels
        run: node scripts/sync-update-source.mjs
        working-directory: desktop-react
