name: Prepare Loom v0.1.20

on:
  push:
    branches:
      - release/loom-v0.1.20-model-access

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bump package metadata and self-clean
        shell: bash
        run: |
          set -euo pipefail
          cd desktop-react
          npm version 0.1.20 --no-git-tag-version
          cd ..
          git rm .github/workflows/prepare-loom-v0.1.20.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-react/package.json desktop-react/package-lock.json
          git commit -m 'chore: prepare Loom v0.1.20 metadata'
          git push origin HEAD:release/loom-v0.1.20-model-access
