name: Fix browser visual feedback motion contract

on:
  push:
    branches:
      - feat/browser-visual-loop

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[visual-contract-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contract and clean helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_capsule_motion_contract.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert transcript.count(\'<span className="task-flow-verb" key={verbKey}>\') == 3'
          new = 'assert transcript.count(\'<span className="task-flow-verb" key={verbKey}>\') == 4'
          if old not in text:
              raise SystemExit('expected motion-contract assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-browser-visual-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ui): account for screenshot activity verb [visual-contract-fixed]"
          git push origin HEAD:feat/browser-visual-loop
