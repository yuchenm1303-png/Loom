name: Loom Application Update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-react/src/**'
      - 'desktop-react/public/**'
      - 'desktop-react/electron/**'
      - 'desktop-react/index.html'
      - 'desktop-react/vite.config.*'
      - 'desktop-react/package.json'
      - 'desktop-react/package-lock.json'
      - 'desktop-react/scripts/publish-application-update.mjs'
      - 'desktop-react/scripts/application-update-eligible.mjs'
      - 'desktop-react/scripts/application-update-smoke.mjs'
      - 'desktop-react/scripts/ui-build-baseline.mjs'
      - '.github/workflows/application-runtime-release.yml'
permissions:
  contents: write
concurrency:
  group: loom-application-stable
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: desktop-react
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-react/package-lock.json
      - name: Verify installed bootstrap compatibility
        id: baseline
        run: node scripts/application-update-eligible.mjs
      - run: npm ci
        if: steps.baseline.outputs.eligible == 'true'
      - run: npm run typecheck && npm run build:electron
        if: steps.baseline.outputs.eligible == 'true'
        shell: bash
      - run: node --experimental-test-module-mocks --test electron/tests/*.test.mjs
        if: steps.baseline.outputs.eligible == 'true'
      - run: node --test scripts/tests/application-update-eligible.test.mjs
        if: steps.baseline.outputs.eligible == 'true'
      - run: npm run build:renderer
        if: steps.baseline.outputs.eligible == 'true'
      - run: node scripts/application-update-smoke.mjs --asar
        if: steps.baseline.outputs.eligible == 'true'
      - name: Publish immutable application files
        if: steps.baseline.outputs.eligible == 'true'
        run: node scripts/publish-application-update.mjs
      - name: Advance channel while this source is current
        if: steps.baseline.outputs.eligible == 'true'
        shell: bash
        run: |
          cp ../application-runtime/stable.json "$RUNNER_TEMP/application-stable.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- src public electron index.html vite.config.ts package.json package-lock.json scripts/publish-application-update.mjs scripts/ui-build-baseline.mjs; then exit 0; fi
            git reset --hard origin/main
            mkdir -p ../application-runtime
            cp "$RUNNER_TEMP/application-stable.json" ../application-runtime/stable.json
            git add ../application-runtime/stable.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(app): advance application channel for $GITHUB_SHA"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
