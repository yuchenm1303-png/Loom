<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loom 手机建造预览</title><style>body{margin:0;background:#202126;color:#eee;font:14px system-ui;display:flex;align-items:center;flex-direction:column;gap:12px;padding:20px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}button{background:#383542;color:#e1d7ff;border:1px solid #655784;border-radius:8px;padding:10px;cursor:pointer}small{color:#b0aeb9}iframe{width:390px;height:min(844px,calc(100vh - 112px));border:1px solid #4b4853;border-radius:24px;background:#101115;box-shadow:0 12px 50px #0007;max-width:calc(100vw - 30px)}</style><header><b>Loom · 手机建造预览</b><button onclick="load(false)">运行中的建造</button><button onclick="load(true)">待确认方案</button><small>模拟数据，可直接点击支路操作</small></header><iframe title="手机建造界面" id="phone"></iframe><script>let timer;function load(proposal){clearInterval(timer);const frame=document.getElementById('phone');frame.src='/scripts/fixtures/mobile.html'+(proposal?'?proposal=1':'');let stage=0,count=0;timer=setInterval(()=>{if(++count>200){clearInterval(timer);return}const doc=frame.contentDocument;if(!doc)return;if(stage===0){const nav=doc.querySelector('.m-nav');const button=nav&&Array.from(nav.querySelectorAll('button')).find(x=>x.textContent.trim()==='建造');if(button){button.click();stage=1}}else{const title=Array.from(doc.querySelectorAll('.m-row strong')).find(x=>x.textContent==='Loom 账号页重做');if(title){title.closest('button').click();clearInterval(timer)}}},150)}load(false)</script></html>
