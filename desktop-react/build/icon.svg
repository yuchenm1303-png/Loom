<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="orb" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#bffcff"/>
      <stop offset=".18" stop-color="#35e8ff"/>
      <stop offset=".44" stop-color="#1698ff"/>
      <stop offset=".70" stop-color="#3656eb"/>
      <stop offset=".88" stop-color="#7453eb"/>
      <stop offset="1" stop-color="#e7a6ff"/>
    </radialGradient>
    <radialGradient id="orbGlass" cx="35%" cy="24%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".88"/>
      <stop offset=".18" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#bfeaff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74f6ff"/>
      <stop offset=".22" stop-color="#18cfff"/>
      <stop offset=".48" stop-color="#1976ff"/>
      <stop offset=".72" stop-color="#5a4df1"/>
      <stop offset=".91" stop-color="#c45cff"/>
      <stop offset="1" stop-color="#ffd9ff"/>
    </linearGradient>
    <linearGradient id="ribbonReverse" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d5ff"/>
      <stop offset=".18" stop-color="#9a5bff"/>
      <stop offset=".46" stop-color="#235ff2"/>
      <stop offset=".72" stop-color="#13c5ff"/>
      <stop offset="1" stop-color="#a7ffff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#18dfff"/>
      <stop offset=".46" stop-color="#176cf0"/>
      <stop offset=".78" stop-color="#6d4df0"/>
      <stop offset="1" stop-color="#f3baff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .08  0 0 0 0 .33  0 0 0 0 1  0 0 0 .44 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="orbClip"><circle cx="500" cy="524" r="222"/></clipPath>
  </defs>

  <!-- broad back orbit -->
  <path d="M126 626 C82 443 168 246 352 196 C555 140 768 244 873 409 C943 520 923 657 823 756 C701 877 474 923 279 854 C164 813 103 730 126 626Z"
        fill="none" stroke="#157cff" stroke-opacity=".18" stroke-width="92" filter="url(#glow)"/>
  <path d="M126 626 C82 443 168 246 352 196 C555 140 768 244 873 409 C943 520 923 657 823 756 C701 877 474 923 279 854 C164 813 103 730 126 626Z"
        fill="none" stroke="url(#ribbon)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 626 C82 443 168 246 352 196 C555 140 768 244 873 409"
        fill="none" stroke="#fff" stroke-opacity=".46" stroke-width="7" stroke-linecap="round"/>

  <!-- upper crossing ribbon -->
  <path d="M143 307 C238 179 429 167 599 227 C727 272 823 355 877 447"
        fill="none" stroke="#27d6ff" stroke-opacity=".18" stroke-width="78" filter="url(#softGlow)"/>
  <path d="M143 307 C238 179 429 167 599 227 C727 272 823 355 877 447"
        fill="none" stroke="url(#ribbonReverse)" stroke-width="58" stroke-linecap="round"/>
  <path d="M149 298 C247 184 430 181 594 237 C718 279 810 356 865 438"
        fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>

  <!-- central glass orb -->
  <circle cx="500" cy="524" r="236" fill="#2c5dff" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="500" cy="524" r="220" fill="url(#orb)" filter="url(#orbShadow)"/>
  <circle cx="500" cy="524" r="210" fill="url(#orbGlass)" opacity=".64"/>
  <ellipse cx="436" cy="406" rx="116" ry="75" fill="#fff" opacity=".14" transform="rotate(-22 436 406)"/>
  <ellipse cx="571" cy="671" rx="140" ry="48" fill="#e9b6ff" opacity=".14" transform="rotate(-18 571 671)"/>
  <circle cx="500" cy="524" r="216" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="5"/>
  <circle cx="500" cy="524" r="221" fill="none" stroke="#5feeff" stroke-opacity=".34" stroke-width="10" filter="url(#softGlow)"/>

  <!-- front orbital ribbon -->
  <path d="M201 670 C329 771 527 799 690 737 C789 700 862 639 896 570"
        fill="none" stroke="#2a72ff" stroke-opacity=".20" stroke-width="84" filter="url(#softGlow)"/>
  <path d="M201 670 C329 771 527 799 690 737 C789 700 862 639 896 570"
        fill="none" stroke="url(#ribbon)" stroke-width="64" stroke-linecap="round"/>
  <path d="M205 658 C337 756 523 780 682 723 C781 688 850 630 884 566"
        fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="6" stroke-linecap="round"/>

  <!-- diagonal glass slash across orb -->
  <path d="M250 420 C353 552 487 654 671 700"
        fill="none" stroke="url(#ribbonReverse)" stroke-width="32" stroke-linecap="round" opacity=".82" clip-path="url(#orbClip)"/>
  <path d="M251 414 C360 547 490 642 667 688"
        fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="4" stroke-linecap="round" clip-path="url(#orbClip)"/>

  <!-- arrow head -->
  <g filter="url(#glow)">
    <path d="M759 213 L924 359 Q939 372 919 378 L814 402 L789 514 Q785 533 772 517 L703 331 Q696 315 713 301 Z"
          fill="url(#arrow)" stroke="#7ff4ff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M716 311 L885 354 L804 377 L783 474 Z" fill="#0ebef8" opacity=".52"/>
    <path d="M716 311 L804 377 L885 354" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="4"/>
    <path d="M804 377 L783 474" fill="none" stroke="#b7fbff" stroke-opacity=".52" stroke-width="4"/>
    <path d="M765 229 L916 358" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>