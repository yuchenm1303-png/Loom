server {
    listen 8800;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Model policy is not exposed as a separate public service. Admin proxies
    # authenticated requests to the internal control plane over the shared edge
    # network. Keep Authorization intact; the policy service delegates admin
    # identity verification back to Loom Account Service.
    location /policy/ {
        proxy_pass http://loom-model-policy:8792/;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://smirel.com; img-src 'self' data: https://smirel.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
