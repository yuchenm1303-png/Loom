services:
  loom-web:
    build:
      context: ../..
      dockerfile: services/loom_web_gateway/Dockerfile
    image: loom-web:local
    container_name: loom-web
    restart: unless-stopped
    environment:
      LOOM_ACCOUNT_API_BASE_URL: https://account.smirel.com/v1
      LOOM_WEB_ORIGIN: ${LOOM_WEB_ORIGIN:-https://loom.smirel.com}
      LOOM_WEB_PROVIDER: ${LOOM_WEB_PROVIDER:-openai-compatible}
      LOOM_WEB_BASE_URL: ${LOOM_WEB_BASE_URL:-}
      LOOM_WEB_MODEL: ${LOOM_WEB_MODEL:-}
      LOOM_WEB_API_KEY: ${LOOM_WEB_API_KEY:-}
      LOOM_WEB_SELECTION: ${LOOM_WEB_SELECTION:-cloud:default}
      LOOM_WEB_PERMISSION_MODE: ${LOOM_WEB_PERMISSION_MODE:-workspace}
    volumes:
      - loom_web_data:/var/lib/loom-web
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  loom_web_data:

networks:
  edge:
    external: true
    name: ${LOOM_EDGE_NETWORK:-termrelay_termrelay-internal}