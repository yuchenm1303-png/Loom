# Loom Account Service — standalone deployment.
#
# Run from this directory:  docker compose up -d --build
#
# The published account port is bound to loopback on purpose. Public traffic
# terminates at the reverse proxy. Model policy is internal-only: Admin reaches
# it over the shared edge network and Model Gateway reaches it over this stack's
# default network.

name: loom-account

services:
  loom-account:
    container_name: loom-account
    build:
      context: ../../..
      dockerfile: services/loom_account/Dockerfile
    image: loom-account:local
    restart: unless-stopped
    env_file:
      - path: .env.auth
        required: false
      - path: .env.search
        required: false
    environment:
      LOOM_ACCOUNT_DB: /data/accounts.db
      LOOM_ACCOUNT_TRUSTED_PROXIES: "127.0.0.1,::1"
    volumes:
      - loom-account-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  loom-model-policy:
    container_name: loom-model-policy
    build:
      context: ../../..
      dockerfile: services/loom_model_policy/Dockerfile
    image: loom-model-policy:local
    restart: unless-stopped
    environment:
      LOOM_ACCOUNT_INTERNAL_URL: http://loom-account:8787/v1
      LOOM_ACCOUNT_DB_READONLY: /account-data/accounts.db
      LOOM_MODEL_POLICY_DB: /data/model-policy.db
    depends_on:
      loom-account:
        condition: service_healthy
    volumes:
      - loom-model-policy-data:/data
      - loom-account-data:/account-data:ro
    expose:
      - "8792"
    ports:
      - "127.0.0.1:8792:8792"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8792/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - edge

  loom-model-gateway:
    container_name: loom-model-gateway
    build:
      context: ../../..
      dockerfile: services/loom_model_gateway/Dockerfile
    image: loom-model-gateway:local
    restart: unless-stopped
    env_file:
      - path: .env.models
        required: false
    environment:
      LOOM_ACCOUNT_INTERNAL_URL: http://loom-account:8787/v1
      LOOM_MODEL_POLICY_INTERNAL_URL: http://loom-model-policy:8792/v1
    depends_on:
      loom-account:
        condition: service_healthy
      loom-model-policy:
        condition: service_healthy
    ports:
      - "127.0.0.1:8791:8790"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  loom-account-data:
  loom-model-policy-data:

networks:
  edge:
    external: true
    name: termrelay_termrelay-internal
