<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Loom Nebula Background Preview</title>
  <style>
    :root {
      --bg-deep: #04071d;
      --bg-blue: #0b1d58;
      --violet: rgba(106, 53, 255, .46);
      --magenta: rgba(236, 75, 255, .31);
      --cyan: rgba(64, 196, 255, .24);
      --rose: rgba(255, 122, 194, .17);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-deep); }
    body { position: relative; }

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(95% 72% at 62% 40%, rgba(62, 110, 255, .22), transparent 60%),
        radial-gradient(78% 72% at 48% 48%, rgba(104, 42, 226, .31), transparent 61%),
        linear-gradient(115deg, #05091f 0%, #090c35 40%, #0b194d 70%, #061436 100%);
    }

    .nebula,
    .nebula::before,
    .nebula::after {
      position: absolute;
      content: "";
      inset: -18%;
      pointer-events: none;
      filter: blur(48px) saturate(130%);
      transform: translate3d(0,0,0) scale(1.08);
    }

    .nebula {
      background:
        radial-gradient(44% 33% at 47% 46%, var(--magenta), transparent 72%),
        radial-gradient(56% 38% at 61% 41%, var(--cyan), transparent 73%),
        radial-gradient(45% 37% at 38% 53%, var(--violet), transparent 75%);
      opacity: .92;
      animation: nebulaDrift 26s ease-in-out infinite alternate;
    }

    .nebula::before {
      inset: -10%;
      background:
        radial-gradient(30% 23% at 54% 45%, rgba(255, 178, 233, .20), transparent 74%),
        radial-gradient(50% 34% at 70% 34%, rgba(78, 160, 255, .18), transparent 78%),
        radial-gradient(40% 36% at 28% 60%, rgba(83, 45, 213, .24), transparent 76%);
      filter: blur(64px) saturate(140%);
      opacity: .76;
      animation: nebulaFloat 34s ease-in-out infinite alternate-reverse;
    }

    .nebula::after {
      inset: 0;
      background:
        radial-gradient(38% 20% at 50% 53%, rgba(207, 115, 255, .16), transparent 80%),
        radial-gradient(28% 16% at 63% 38%, rgba(128, 216, 255, .12), transparent 82%),
        radial-gradient(26% 18% at 39% 42%, rgba(255, 110, 194, .10), transparent 82%);
      filter: blur(72px);
      opacity: .72;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, transparent 25%, rgba(1, 4, 18, .06) 55%, rgba(1, 3, 14, .44) 100%),
        linear-gradient(to bottom, rgba(3, 5, 22, .04), rgba(2, 4, 18, .26));
      z-index: 4;
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 3; }

    @keyframes nebulaDrift {
      from { transform: translate3d(-2.2%, -1.1%, 0) scale(1.06); }
      to   { transform: translate3d(2.8%, 1.6%, 0) scale(1.12); }
    }
    @keyframes nebulaFloat {
      from { transform: translate3d(2%, -1.5%, 0) scale(1.02); }
      to   { transform: translate3d(-2.5%, 2.2%, 0) scale(1.09); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nebula, .nebula::before { animation: none; }
    }
  </style>
</head>
<body>
  <div class="space" aria-hidden="true">
    <div class="nebula"></div>
    <canvas id="stars"></canvas>
    <div class="vignette"></div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d', { alpha: true });
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      let w = 0, h = 0, cx = 0, cy = 0;
      let particles = [];
      let raf = 0;
      let last = performance.now();

      const settings = {
        count: reducedMotion ? 80 : 260,
        speed: reducedMotion ? 0.25 : 0.86,
        focal: 520,
        nearTrail: 0.74,
      };

      function resize() {
        w = innerWidth;
        h = innerHeight;
        cx = w * 0.52;
        cy = h * 0.46;
        canvas.width = Math.floor(w * DPR);
        canvas.height = Math.floor(h * DPR);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        seed();
      }

      function makeParticle(resetNear = false) {
        const span = Math.max(w, h);
        return {
          x: (Math.random() - 0.5) * span * 1.8,
          y: (Math.random() - 0.5) * span * 1.2,
          z: resetNear ? 1050 + Math.random() * 250 : 40 + Math.random() * 1180,
          pz: 0,
          radius: 0.45 + Math.random() * 1.2,
          alpha: 0.24 + Math.random() * 0.62,
          tint: Math.random(),
          twinkle: Math.random() * Math.PI * 2,
        };
      }

      function seed() {
        particles = Array.from({ length: settings.count }, () => makeParticle());
      }

      function drawParticle(p, dt, time) {
        p.pz = p.z;
        p.z -= settings.speed * dt * (0.75 + (1200 - p.z) / 980);
        if (p.z < 18) Object.assign(p, makeParticle(true));

        const sx = cx + (p.x / p.z) * settings.focal;
        const sy = cy + (p.y / p.z) * settings.focal;
        const px = cx + (p.x / Math.max(p.pz, 20)) * settings.focal;
        const py = cy + (p.y / Math.max(p.pz, 20)) * settings.focal;

        if (sx < -80 || sx > w + 80 || sy < -80 || sy > h + 80) {
          Object.assign(p, makeParticle(true));
          return;
        }

        const depth = 1 - Math.min(p.z / 1250, 1);
        const glow = 0.8 + Math.sin(time * 0.0018 + p.twinkle) * 0.2;
        const size = p.radius * (0.55 + depth * 2.7);
        const a = p.alpha * (0.32 + depth * 0.78) * glow;

        let rgb = '214,229,255';
        if (p.tint > 0.72) rgb = '180,224,255';
        else if (p.tint < 0.18) rgb = '238,205,255';

        if (depth > 0.55 && !reducedMotion) {
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(sx, sy);
          ctx.strokeStyle = `rgba(${rgb},${a * settings.nearTrail * depth})`;
          ctx.lineWidth = Math.max(0.45, size * 0.72);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${rgb},${a})`;
        ctx.shadowBlur = depth > 0.6 ? 7 + depth * 12 : 0;
        ctx.shadowColor = `rgba(${rgb},${a})`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function frame(now) {
        const dt = Math.min((now - last) / 16.6667, 2.2);
        last = now;
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) drawParticle(p, dt, now);
        raf = requestAnimationFrame(frame);
      }

      addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelAnimationFrame(raf);
        else { last = performance.now(); raf = requestAnimationFrame(frame); }
      });

      resize();
      raf = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
