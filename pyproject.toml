[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-agent"
version = "0.1.0"
description = "Personal general-purpose tool-using AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
browser = [
    "browser-use>=0.13.10,<0.14",
]

[project.scripts]
loom = "loom_cli:main"

[tool.setuptools]
py-modules = ["loom_cli"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
