[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-agent"
version = "0.1.0"
description = "Personal general-purpose tool-using AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.66,<3",
    "keyring>=25,<26",
    "PyYAML>=6,<7",
    "jsonschema>=4.23,<5",
    "mcp>=2.1,<3",
    "pywinpty>=3.0.5,<4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
browser = [
    "browser-use>=0.13.10,<0.14",
]
mcp = [
    "mcp>=2.1,<3",
]
computer = [
    "Pillow>=11,<13",
    "pyautogui>=0.9.54,<0.10; platform_system == 'Windows'",
    "pywinauto>=0.6.9,<0.7; platform_system == 'Windows'",
    "pywin32>=306,<400; platform_system == 'Windows'",
]
desktop-agent = [
    "browser-use>=0.13.10,<0.14",
    "Pillow>=11,<13",
    "pyautogui>=0.9.54,<0.10; platform_system == 'Windows'",
    "pywinauto>=0.6.9,<0.7; platform_system == 'Windows'",
    "pywin32>=306,<400; platform_system == 'Windows'",
]

[project.scripts]
loom = "app.skill_dispatch:main"
loom-skill = "app.skill_cli:main"
loom-web = "loom_web:main"
loom-app-server = "loom_app_server:main"

[tool.setuptools]
py-modules = ["loom_cli", "loom_web", "loom_app_server"]

[tool.setuptools.package-data]
app = ["web_static/*"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
