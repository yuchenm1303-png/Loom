[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-agent"
version = "0.1.0"
description = "Personal general-purpose tool-using AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
browser = [
    "browser-use>=0.13.10,<0.14",
]
mcp = [
    "mcp>=2.1,<3",
]
desktop = [
    "PySide6>=6.7,<7",
]

[project.scripts]
loom = "loom_cli:main"
loom-web = "loom_web:main"
loom-app-server = "loom_app_server:main"

[project.gui-scripts]
loom-desktop = "loom_desktop:main"

[tool.setuptools]
py-modules = ["loom_cli", "loom_web", "loom_app_server", "loom_desktop"]

[tool.setuptools.package-data]
app = ["web_static/*"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
